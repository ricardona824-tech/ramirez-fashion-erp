{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Registrar Nuevo Pedido</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Pedido</button>
                            <a href="{% url 'clientes:lista_pedidos' %}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Buscamos todos los campos que tengan la clase 'formato-dinero'
        const inputsDinero = document.querySelectorAll('.formato-dinero');

        inputsDinero.forEach(input => {
            // (Mejora) Si el campo ya tiene un valor al cargar la página, lo formateamos
            if (input.value) {
                let valorPuroInicial = input.value.replace(/\D/g, "");
                if (valorPuroInicial) {
                    input.value = new Intl.NumberFormat('es-CO').format(valorPuroInicial);
                }
            }

            // 2. Cada vez que el usuario teclea algo...
            input.addEventListener('input', function(e) {
                // Borramos todo lo que no sea un número (letras, puntos viejos, etc.)
                let valorPuro = this.value.replace(/\D/g, "");

                if (valorPuro) {
                    // Formateamos con puntos de miles (estilo Colombia)
                    this.value = new Intl.NumberFormat('es-CO').format(valorPuro);
                } else {
                    this.value = "";
                }
            });
        });

        // 3. El truco final: Antes de enviar el formulario, limpiamos los puntos
        const form = document.querySelector('form');
        if(form) {
            form.addEventListener('submit', function() {
                inputsDinero.forEach(input => {
                    // Quitamos todos los puntos para que Django guarde el número puro sin errores
                    input.value = input.value.replace(/\./g, '').replace(/,/g, '');
                });
            });
        }
    });
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputsDinero = document.querySelectorAll('.formato-dinero');

        inputsDinero.forEach(input => {
            // 1. CARGA INICIAL: Cortar los decimales si vienen de la base de datos
            if (input.value) {
                // Partimos el texto en el punto (o coma) y nos quedamos solo con la parte entera
                let parteEntera = input.value.split('.')[0].split(',')[0];
                let valorPuroInicial = parteEntera.replace(/\D/g, "");

                if (valorPuroInicial) {
                    input.value = new Intl.NumberFormat('es-CO').format(valorPuroInicial);
                }
            }

            // 2. MIENTRAS EL USUARIO ESCRIBE
            input.addEventListener('input', function(e) {
                let valorPuro = this.value.replace(/\D/g, "");

                if (valorPuro) {
                    this.value = new Intl.NumberFormat('es-CO').format(valorPuro);
                } else {
                    this.value = "";
                }
            });
        });

        // 3. ANTES DE GUARDAR: Limpiar para Django
        const form = document.querySelector('form');
        if(form) {
            form.addEventListener('submit', function() {
                inputsDinero.forEach(input => {
                    input.value = input.value.replace(/\./g, '').replace(/,/g, '');
                });
            });
        }
    });
</script>
{% endblock %}
