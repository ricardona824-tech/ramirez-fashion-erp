{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Registrar Nuevo Pedido</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Pedido</button>
                            <a href="{% url 'clientes:lista_pedidos' %}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputsDinero = document.querySelectorAll('.formato-dinero');

        // Función maestra para formatear (Agrega el $ y los puntos)
        function aplicarFormatoVisual(valorCrudo) {
            // Extraemos solo los números, ignorando letras, signos o puntos viejos
            let valorPuro = valorCrudo.replace(/\D/g, "");
            if (valorPuro) {
                // Retornamos el valor con el signo $ y formato colombiano
                return "$ " + new Intl.NumberFormat('es-CO').format(valorPuro);
            }
            return "";
        }

        inputsDinero.forEach(input => {
            // 1. CARGA INICIAL (Modo Edición): Arreglar el 3600.00 que trae Django
            if (input.value) {
                // Partimos el número en el punto decimal y nos quedamos solo con la parte entera (el 3600)
                let parteEntera = input.value.split('.')[0].split(',')[0];
                input.value = aplicarFormatoVisual(parteEntera);
            }

            // 2. MIENTRAS EL USUARIO ESCRIBE: Formato en tiempo real
            input.addEventListener('input', function(e) {
                this.value = aplicarFormatoVisual(this.value);
            });
        });

        // 3. ANTES DE GUARDAR: Deshacer el truco visual para la base de datos
        const form = document.querySelector('form');
        if(form) {
            form.addEventListener('submit', function() {
                inputsDinero.forEach(input => {
                    // Borramos el $, los puntos y los espacios. Dejamos solo los números puros.
                    input.value = input.value.replace(/\D/g, '');
                });
            });
        }
    });
</script>
{% endblock %}
