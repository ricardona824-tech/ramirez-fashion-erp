{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark fw-bold">
            <h4 class="mb-0">🛒 Formulario de Venta (Inventario)</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Confirmar Venta y Generar Deuda</button>
                    <a href="{% url 'clientes:mi_inventario' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
