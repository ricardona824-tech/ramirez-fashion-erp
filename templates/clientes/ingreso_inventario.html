{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">📦 Ingresar Mercancía al Inventario</h3>
        </div>
        <div class="card-body">
            <p class="text-muted">Usa este formulario para registrar mercancía comprada para stock. Se crearán unidades individuales automáticamente.</p>

            <form method="POST" action="">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        Guardar Unidades en Inventario
                    </button>
                    <a href="{% url 'clientes:mi_inventario' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Buscamos todos los campos que tengan la clase 'formato-dinero'
        const inputsDinero = document.querySelectorAll('.formato-dinero');

        inputsDinero.forEach(input => {
            // Si el campo ya tiene un valor al cargar la página, lo formateamos
            if (input.value) {
                let valorPuroInicial = input.value.replace(/\D/g, "");
                if (valorPuroInicial) {
                    input.value = new Intl.NumberFormat('es-CO').format(valorPuroInicial);
                }
            }

            // Cada vez que el usuario teclea algo...
            input.addEventListener('input', function(e) {
                // Borramos todo lo que no sea un número
                let valorPuro = this.value.replace(/\D/g, "");

                if (valorPuro) {
                    // Formateamos con puntos de miles (estilo Colombia)
                    this.value = new Intl.NumberFormat('es-CO').format(valorPuro);
                } else {
                    this.value = "";
                }
            });
        });

        // El truco final: Antes de enviar el formulario, limpiamos los puntos
        const form = document.querySelector('form');
        if(form) {
            form.addEventListener('submit', function() {
                inputsDinero.forEach(input => {
                    // Quitamos todos los puntos para que Django guarde el número puro sin errores
                    input.value = input.value.replace(/\./g, '').replace(/,/g, '');
                });
            });
        }
    });
</script>
{% endblock %}
