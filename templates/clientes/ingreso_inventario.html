{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">📦 Ingresar Mercancía al Inventario</h3>
        </div>
        <div class="card-body">
            <p class="text-muted">Usa este formulario para registrar mercancía comprada para stock. Se crearán unidades individuales automáticamente.</p>

            <form method="POST" action="">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        Guardar Unidades en Inventario
                    </button>
                    <a href="{% url 'clientes:mi_inventario' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputsDinero = document.querySelectorAll('.formato-dinero');

        inputsDinero.forEach(input => {
            // 1. CARGA INICIAL: Cortar los decimales si vienen de la base de datos
            if (input.value) {
                // Partimos el texto en el punto (o coma) y nos quedamos solo con la parte entera
                let parteEntera = input.value.split('.')[0].split(',')[0];
                let valorPuroInicial = parteEntera.replace(/\D/g, "");

                if (valorPuroInicial) {
                    input.value = new Intl.NumberFormat('es-CO').format(valorPuroInicial);
                }
            }

            // 2. MIENTRAS EL USUARIO ESCRIBE
            input.addEventListener('input', function(e) {
                let valorPuro = this.value.replace(/\D/g, "");

                if (valorPuro) {
                    this.value = new Intl.NumberFormat('es-CO').format(valorPuro);
                } else {
                    this.value = "";
                }
            });
        });

        // 3. ANTES DE GUARDAR: Limpiar para Django
        const form = document.querySelector('form');
        if(form) {
            form.addEventListener('submit', function() {
                inputsDinero.forEach(input => {
                    input.value = input.value.replace(/\./g, '').replace(/,/g, '');
                });
            });
        }
    });
</script>
{% endblock %}
